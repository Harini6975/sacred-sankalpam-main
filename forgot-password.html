<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacred Sankalpam | Forgot Password</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    .auth-outside-controls {
      position: fixed;
      top: 20px;
      inset-inline-end: 20px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 18px;
    }

    .auth-banner-preview {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--color-secondary);
      margin-bottom: 18px;
    }

    [data-theme="dark"] .auth-banner-preview {
      border-color: #E6B85E;
    }

    @media (max-width: 600px) {
      .auth-outside-controls {
        top: 12px;
        inset-inline-end: 12px;
      }
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-outside-controls" aria-label="Appearance and layout controls">
    <button type="button" class="icon-toggle-btn" id="themeToggleBtn" aria-label="Toggle light and dark mode" title="Toggle light and dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <button type="button" class="dir-toggle-btn" id="dirToggleBtn" aria-label="Switch layout to Right-to-Left (RTL)" title="Switch layout to Right-to-Left (RTL)">⇄</button>
  </div>

  <main class="auth-card">
    <div class="auth-top-bar">
      <a href="index.html" class="brand-logo" aria-label="Sacred Sankalpam Home">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="21" stroke="#8B2635" stroke-width="2.5" fill="#FAF7F2"/>
          <polygon points="24,8 37,24 24,40 11,24" stroke="#D69B37" stroke-width="2.2" fill="none"/>
          <circle cx="24" cy="24" r="5" fill="#8B2635"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Sacred Sankalpam</span>
          <span class="brand-tagline">Pooja & Priest Booking</span>
        </span>
      </a>
    </div>

    <img src="images/banners/temple-bg.png" data-fallback="images/banners/corridor-banner.png" alt="Traditional South Indian temple courtyard at dawn" class="auth-banner-preview">

    <h1 class="auth-heading">Reset Password</h1>
    <p class="auth-subtitle">Enter your email address to receive reset instructions.</p>

    <div id="forgotAlert" class="auth-alert" role="alert"></div>

    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label for="forgotEmail" class="form-label">Email Address</label>
        <input type="email" id="forgotEmail" class="form-control" autocomplete="email" required>
        <span class="form-error" id="errForgotEmail"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>

    <p class="auth-switch-text">
      <a href="login.html">Back to Login</a>
    </p>

    <p class="auth-security-note">
      Prototype note: Frontend state only; no real authentication or production role security.
    </p>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/direction.js"></script>
  <script src="js/section-motion.js"></script>
  <script>
    (function () {
      document.documentElement.setAttribute("lang", "en");

      const form = document.getElementById("forgotForm");
      const emailEl = document.getElementById("forgotEmail");
      const errEmail = document.getElementById("errForgotEmail");
      const alertBox = document.getElementById("forgotAlert");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        errEmail.textContent = "";
        alertBox.style.display = "none";

        const val = emailEl.value.trim();
        if (!val || !val.includes("@") || !val.includes(".")) {
          errEmail.textContent = "Please enter a valid email address.";
          return;
        }

        alertBox.className = "auth-alert badge-success";
        alertBox.style.display = "block";
        alertBox.textContent = "Password reset instructions are simulated in this frontend prototype.";
        form.reset();
      });
    })();
  </script>
</body>
</html>
